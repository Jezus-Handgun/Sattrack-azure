[project]
name = "sattrack"
version = "0.1.0"
description = "GNSS satellite visibility planner deployed on Azure Container Apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.1",
    "uvicorn==0.54.0",
    "skyfield==1.55",
    "httpx==0.28.1",
    "pydantic-settings==2.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
