[project]
name = "sattrack"
version = "0.1.0"
description = "GNSS satellite visibility planner deployed on Azure Container Apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.1",
    "uvicorn==0.54.0",
    "skyfield==1.55",
    "httpx==0.28.1",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
# The app runs from the repo root (uvicorn app.main:app), so it is not built as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
